aid: procurement-sciences
name: Procurement Sciences
description: >-
  Procurement Sciences is an AI platform for government contractors that automates the full
  capture-to-contract lifecycle — opportunity search and bid/no-bid analysis, competitive intelligence
  and capture planning, compliant proposal generation and AI-assisted drafting, and post-award contract
  and recompete management — across federal, state, and local markets. The company reports serving
  3,000+ businesses, including nearly 50% of the Top 100 government contractors. It was surfaced as a
  portfolio company of Battery Ventures and added to the API Evangelist network. Procurement Sciences
  publishes no public developer API surface; this profile is enriched from its public website and its
  security & compliance (Trust Portal) disclosures — SOC 2 Type II, CMMC Level 2, FedRAMP Moderate,
  NIST 800-171, and FIPS 140-2.
